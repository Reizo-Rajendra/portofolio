<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#05131e"/>
      <stop offset="100%" stop-color="#02080f"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d26a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background with Cyber Grid -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Scanning laser lines -->
  <line x1="0" y1="210" x2="800" y2="210" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="0" y1="290" x2="800" y2="290" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- HUD Corner Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#00ff88" stroke-width="2.5"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#00ff88" stroke-width="2.5"/>
  <path d="M 30 450 L 30 470 L 50 470" fill="none" stroke="#00ff88" stroke-width="2.5"/>
  <path d="M 770 450 L 770 470 L 750 470" fill="none" stroke="#00ff88" stroke-width="2.5"/>

  <!-- Telemetry Overlay Info -->
  <text x="45" y="55" fill="#00ff88" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">SYS://MEDIAPIPE_HAND_TRACKER</text>
  <text x="755" y="55" text-anchor="end" fill="#00f0ff" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">FPS: 60 | LATENCY: &lt;60ms</text>

  <!-- Central Hand Skeleton Illustration with 21 Landmarks -->
  <g transform="translate(180, 70)" filter="url(#glow)">
    <!-- Palm / Wrist Connections -->
    <path d="M 220 340 L 150 280 L 180 180 L 230 150 L 280 170 L 310 270 Z" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="2"/>
    <!-- Thumb Bones -->
    <polyline points="150,280 110,240 85,200 70,165" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
    <!-- Index Finger Bones -->
    <polyline points="180,180 170,120 165,80 160,45" fill="none" stroke="#00ff88" stroke-width="2.5"/>
    <!-- Middle Finger Bones -->
    <polyline points="230,150 230,95 230,55 230,20" fill="none" stroke="#00ff88" stroke-width="2.5"/>
    <!-- Ring Finger Bones -->
    <polyline points="280,170 290,115 295,80 300,50" fill="none" stroke="#00ff88" stroke-width="2.5"/>
    <!-- Pinky Bones -->
    <polyline points="310,270 340,210 355,170 370,135" fill="none" stroke="#00f0ff" stroke-width="2.5"/>

    <!-- Key Landmark Nodes (Circles) -->
    <!-- Wrist -->
    <circle cx="220" cy="340" r="7" fill="#00ff88" stroke="#ffffff" stroke-width="2"/>
    <!-- Thumb -->
    <circle cx="150" cy="280" r="5" fill="#00f0ff"/>
    <circle cx="110" cy="240" r="5" fill="#00f0ff"/>
    <circle cx="85" cy="200" r="5" fill="#00f0ff"/>
    <circle cx="70" cy="165" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Index -->
    <circle cx="180" cy="180" r="5" fill="#00ff88"/>
    <circle cx="170" cy="120" r="5" fill="#00ff88"/>
    <circle cx="165" cy="80" r="5" fill="#00ff88"/>
    <circle cx="160" cy="45" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Middle -->
    <circle cx="230" cy="150" r="5" fill="#00ff88"/>
    <circle cx="230" cy="95" r="5" fill="#00ff88"/>
    <circle cx="230" cy="55" r="5" fill="#00ff88"/>
    <circle cx="230" cy="20" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Ring -->
    <circle cx="280" cy="170" r="5" fill="#00ff88"/>
    <circle cx="290" cy="115" r="5" fill="#00ff88"/>
    <circle cx="295" cy="80" r="5" fill="#00ff88"/>
    <circle cx="300" cy="50" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Pinky -->
    <circle cx="310" cy="270" r="5" fill="#00f0ff"/>
    <circle cx="340" cy="210" r="5" fill="#00f0ff"/>
    <circle cx="355" cy="170" r="5" fill="#00f0ff"/>
    <circle cx="370" cy="135" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Audio Waveform Visualizer on the right -->
  <g transform="translate(630, 240)">
    <rect x="0" y="-30" width="4" height="60" fill="#00ff88" rx="2"/>
    <rect x="10" y="-15" width="4" height="30" fill="#00f0ff" rx="2"/>
    <rect x="20" y="-45" width="4" height="90" fill="#00ff88" rx="2"/>
    <rect x="30" y="-25" width="4" height="50" fill="#00f0ff" rx="2"/>
    <rect x="40" y="-55" width="4" height="110" fill="#00ff88" rx="2"/>
    <rect x="50" y="-35" width="4" height="70" fill="#00f0ff" rx="2"/>
    <rect x="60" y="-15" width="4" height="30" fill="#00ff88" rx="2"/>
    <rect x="70" y="-40" width="4" height="80" fill="#00f0ff" rx="2"/>
    <rect x="80" y="-20" width="4" height="40" fill="#00ff88" rx="2"/>
    <text x="40" y="75" text-anchor="middle" fill="#00ff88" font-family="'Courier New', monospace" font-size="10">VOICE SYNTH</text>
  </g>

  <!-- Bottom HUD Banner -->
  <rect x="50" y="405" width="700" height="50" fill="#051522" fill-opacity="0.9" stroke="#00f0ff" stroke-width="1" rx="6"/>
  <text x="75" y="436" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="18" letter-spacing="1">AI GESTURE</text>
  <text x="320" y="435" fill="#00ff88" font-family="'Courier New', monospace" font-size="12">▶ 21 LANDMARK 3D MESH</text>
  <text x="545" y="435" fill="#00f0ff" font-family="'Courier New', monospace" font-size="12">▶ ZERO-DELAY INDO AUDIO</text>
</svg>